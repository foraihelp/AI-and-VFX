name: Daily AI & VFX video digest

on:
  schedule:
    # GitHub cron is always UTC. "0 7 * * *" = 07:00 UTC every day.
    # Edit this line to change the delivery time (see README.md).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = email + remember videos | dry-run = print only | test-email = tiny test message"
        type: choice
        default: dry-run
        options: [dry-run, send, test-email]

# Needed only so the job can commit state/seen.json.
permissions:
  contents: write

# Never run two digests at once (they would race on the state file).
concurrency:
  group: video-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pip install pytest && python -m pytest -q

      - name: Run digest
        env:
          # Secrets
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Non-secret settings (Settings > Secrets and variables > Actions > Variables)
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          INITIAL_LOOKBACK_HOURS: ${{ vars.INITIAL_LOOKBACK_HOURS }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
          SUMMARIES: ${{ vars.SUMMARIES }}
          MAX_ITEMS_PER_SOFTWARE: ${{ vars.MAX_ITEMS_PER_SOFTWARE }}
          INCLUDE_SHORTS: ${{ vars.INCLUDE_SHORTS }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          case "$MODE" in
            send)       python -m video_digest --send ;;
            test-email) python -m video_digest test-email ;;
            *)          python -m video_digest ;;
          esac

      - name: Commit updated state
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: |
          git config user.name "video-digest-bot"
          git config user.email "video-digest-bot@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then echo "No state change."; exit 0; fi
          git commit -m "Update video digest state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push state after 3 attempts"; exit 1
